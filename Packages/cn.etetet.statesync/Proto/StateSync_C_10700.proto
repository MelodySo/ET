syntax = "proto3";
package ET;

message RouterSync
{
	uint32 ConnectId = 1;
	string Address = 2;
}

// ResponseType M2C_Reload
message C2M_Reload // ISessionRequest
{
	int32 RpcId = 1;
	string Account = 2;
	string Password = 3;
}

message M2C_Reload // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}


message G2C_TestHotfixMessage // ISessionMessage
{
	string Info = 1;
}


// ResponseType G2C_Benchmark
message C2G_Benchmark // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_Benchmark // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

message BrawlPracticeUnitInfo
{
    int64 UnitId = 1;
    int32 Kind = 2;
    int32 ConfigId = 3;
    int32 Faction = 4;
    float X = 5;
    float Y = 6;
    float Z = 7;
    float FacingX = 8;
    float FacingZ = 9;
}

// ResponseType G2C_BrawlPracticeEnter
message C2G_BrawlPracticeEnter // ISessionRequest
{
    int32 RpcId = 1;
    int32 HeroId = 2;
    int64 EntryId = 3;
}

message G2C_BrawlPracticeEnter // ISessionResponse
{
    int32 RpcId = 1;
    int32 Error = 2;
    string Message = 3;
    int64 RoomId = 4;
    int32 LevelId = 5;
    int64 MyUnitId = 6;
    int32 CellSize = 7;
    repeated BrawlPracticeUnitInfo Units = 8;
}

// ResponseType G2C_BrawlPracticeExit
message C2G_BrawlPracticeExit // ISessionRequest
{
    int32 RpcId = 1;
    int64 EntryId = 2;
}

message G2C_BrawlPracticeExit // ISessionResponse
{
    int32 RpcId = 1;
    int32 Error = 2;
    string Message = 3;
}

message C2G_BrawlMoveInput // ISessionMessage
{
    int64 EntryId = 1;
    int64 Sequence = 2;
    float X = 3;
    float Z = 4;
    // X/Z 是移动意图；FacingX/Z 是独立的人物面向，不是技能摇杆瞄准方向。
    float FacingX = 5;
    float FacingZ = 6;
}

message BrawlMoveState
{
    int64 UnitId = 1;
    float X = 2;
    float Z = 3;
    float MoveX = 4;
    float MoveZ = 5;
    float FacingX = 6;
    float FacingZ = 7;
}

message G2C_BrawlMoveSnapshot // IMessage
{
    int64 EntryId = 1;
    int64 RoomId = 2;
    int64 Tick = 3;
    int64 LastInputSequence = 4;
    repeated BrawlMoveState Units = 5;
}

// 普攻释放意图；X/Z 为本次施放方向，独立于移动/人物面向。准备拖动不发送此消息。
message C2G_BrawlNormalAttack // ISessionMessage
{
    int64 EntryId = 1;
    int64 Sequence = 2;
    float X = 3;
    float Z = 4;
}

message BrawlProjectileState
{
    int64 ProjectileId = 1;
    int32 ConfigId = 2;
    int64 OwnerUnitId = 3;
    float X = 4;
    float Y = 5;
    float Z = 6;
    float Radius = 7;
    int32 Faction = 8;
}

// 房间所有在场弹丸的完整快照，缺席表示已移除；Sequence 区分同 Tick 多次释放。
message G2C_BrawlProjectileSnapshot // IMessage
{
    int64 EntryId = 1;
    int64 RoomId = 2;
    int64 Sequence = 3;
    int64 Tick = 4;
    repeated BrawlProjectileState Projectiles = 5;
}
