syntax = "proto3";
package ET;

message RouterSync
{
	uint32 ConnectId = 1;
	string Address = 2;
}

// ResponseType M2C_Reload
message C2M_Reload // ISessionRequest
{
	int32 RpcId = 1;
	string Account = 2;
	string Password = 3;
}

message M2C_Reload // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}


message G2C_TestHotfixMessage // ISessionMessage
{
	string Info = 1;
}


// ResponseType G2C_Benchmark
message C2G_Benchmark // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_Benchmark // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

message BrawlPracticeUnitInfo
{
    int64 UnitId = 1;
    int32 Kind = 2;
    int32 ConfigId = 3;
    int32 Faction = 4;
    float X = 5;
    float Y = 6;
    float Z = 7;
    float FacingX = 8;
    float FacingZ = 9;
    int32 Level = 10;
    float Health = 11;
    float MaxHealth = 12;
    repeated BrawlStateValue States = 13;
    int64 SpawnCompleteAt = 14;
    int64 DeathDestroyAt = 15;
    int32 MaxAmmo = 16;
    float Ammo = 17;
    float ReloadRate = 18;
    int32 MaxSuperAmmo = 19;
    float SuperAmmo = 20;
    float SuperChargeRegenRate = 21;
}

// ResponseType G2C_BrawlPracticeEnter
message C2G_BrawlPracticeEnter // ISessionRequest
{
    int32 RpcId = 1;
    int32 HeroId = 2;
    int64 EntryId = 3;
    int32 LevelId = 4;
}

message G2C_BrawlPracticeEnter // ISessionResponse
{
    int32 RpcId = 1;
    int32 Error = 2;
    string Message = 3;
    int64 RoomId = 4;
    int32 LevelId = 5;
    int64 MyUnitId = 6;
    int32 CellSize = 7;
    repeated BrawlPracticeUnitInfo Units = 8;
}

// ResponseType G2C_BrawlPracticeExit
message C2G_BrawlPracticeExit // ISessionRequest
{
    int32 RpcId = 1;
    int64 EntryId = 2;
}

message G2C_BrawlPracticeExit // ISessionResponse
{
    int32 RpcId = 1;
    int32 Error = 2;
    string Message = 3;
}

message C2G_BrawlMoveInput // ISessionMessage
{
    int64 EntryId = 1;
    int64 Sequence = 2;
    float X = 3;
    float Z = 4;
    // X/Z 是移动意图；FacingX/Z 是独立的人物面向，不是技能摇杆瞄准方向。
    float FacingX = 5;
    float FacingZ = 6;
}

message BrawlMoveState
{
    int64 UnitId = 1;
    float X = 2;
    float Z = 3;
    float MoveX = 4;
    float MoveZ = 5;
    float FacingX = 6;
    float FacingZ = 7;
}

message G2C_BrawlMoveSnapshot // IMessage
{
    int64 EntryId = 1;
    int64 RoomId = 2;
    int64 Tick = 3;
    int64 LastInputSequence = 4;
    repeated BrawlMoveState Units = 5;
    repeated BrawlPropertyState Properties = 6;
    repeated BrawlUnitStateChanges States = 7;
    int64 MyUnitId = 8;
    bool HasRoster = 9;
    repeated BrawlPracticeUnitInfo Roster = 10;
    repeated BrawlLifeEvent LifeEvents = 11;
}

// 服务器模拟毫秒；仅供未来表现，不由客户端驱动玩法计时。
message BrawlLifeEvent
{
    int64 UnitId = 1;
    int32 Phase = 2;
    int64 At = 3;
    int64 EndsAt = 4;
}

message BrawlStateValue
{
    int32 StateId = 1;
    bool Value = 2;
}

// 仅最终布尔值发生变化时同步，不下发来源或计时器；顺序沿用外层Tick。
message BrawlUnitStateChanges
{
    int64 UnitId = 1;
    repeated BrawlStateValue States = 2;
}

// 当前练习房间单位属性快照，包含不移动的NPC；英雄额外同步弹药与装填速率。
message BrawlPropertyState
{
    int64 UnitId = 1;
    int32 Level = 2;
    float Health = 3;
    float MaxHealth = 4;
    int32 MaxAmmo = 5;
    float Ammo = 6;
    float ReloadRate = 7;
    int32 MaxSuperAmmo = 8;
    float SuperAmmo = 9;
    float SuperChargeRegenRate = 10;
}

// 技能释放意图；服务器按英雄配置选择槽位技能，不接受客户端技能ID。准备拖动不发送。
message C2G_BrawlCastSkill // ISessionMessage
{
    int64 EntryId = 1;
    int64 Sequence = 2;
    float X = 3;
    float Z = 4;
    int32 Slot = 5;
}

message BrawlProjectileState
{
    int64 ProjectileId = 1;
    int32 ConfigId = 2;
    int64 OwnerUnitId = 3;
    float X = 4;
    float Y = 5;
    float Z = 6;
    float Radius = 7;
    int32 Faction = 8;
    float DirectionX = 9;
    float DirectionZ = 10;
}

// 房间所有在场弹丸的完整快照，缺席表示已移除；Sequence 区分同 Tick 多次释放。
message G2C_BrawlProjectileSnapshot // IMessage
{
    int64 EntryId = 1;
    int64 RoomId = 2;
    int64 Sequence = 3;
    int64 Tick = 4;
    repeated BrawlProjectileState Projectiles = 5;
    repeated BrawlProjectileEvent Events = 6;
    // 房间内已清除草格的完整集合；不修改客户端共享关卡配置。
    repeated int32 ClearedGrass = 7;
}

// 独立事件ID去重；Tick用于客户端插值时间线。TerrainIndex=-1表示单位目标或结束事件。
message BrawlProjectileEvent
{
    int64 EventId = 1;
    int64 Tick = 2;
    int64 ProjectileId = 3;
    int32 ConfigId = 4;
    int64 OwnerUnitId = 5;
    int64 TargetUnitId = 6;
    int32 TerrainIndex = 7;
    int32 Kind = 8;
    int32 EndReason = 9;
    float X = 10;
    float Y = 11;
    float Z = 12;
    float NormalX = 13;
    float NormalZ = 14;
    bool Blocked = 15;
    bool Effective = 16;
}

// 服务器确认的技能表现事件，与请求序号、弹丸数量独立。
message G2C_BrawlSkillUse // IMessage
{
    int64 EntryId = 1;
    int64 RoomId = 2;
    repeated BrawlSkillUseEvent Events = 3;
}

message BrawlSkillUseEvent
{
    int64 EventId = 1;
    int64 CastId = 2;
    int64 UnitId = 3;
    int32 SkillId = 4;
    int32 Slot = 5;
    int64 Tick = 6;
    int32 Phase = 7;
    float DirectionX = 8;
    float DirectionZ = 9;
    bool LockFacing = 10;
    bool FaceDirection = 11;
    bool ImmediatePresentation = 12;
    int32 StepId = 13;
    int32 PresentationId = 14;
    int64 DurationMilliseconds = 15;
    float Radius = 16;
    float PositionX = 17;
    float PositionY = 18;
    float PositionZ = 19;
}
